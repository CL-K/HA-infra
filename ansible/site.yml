---
# ============================================================
# site.yml - Orchestrator playbook of the HA-infra project
#
# Runs from the ansible/ folder (where ansible.cfg points
# to ./hosts, located in this same folder).
#
# Usage:
#   cd ansible
#   ansible-playbook site.yml                      -> deploy everything
#   ansible-playbook site.yml --tags k3s            -> k3s only
#   ansible-playbook site.yml --skip-tags guestbook -> everything except the demo
#
# TLS (Let's Encrypt): the cert-manager step requires a valid
# contact email. Provide it via --extra-vars, otherwise the playbook's
# default value "changeme@domain.com" is used (to avoid
# in real use):
#   ansible-playbook site.yml -e letsencrypt_email=YOUR_REAL_EMAIL@YOUR_DOMAIN.com
#
# Prerequisites: terraform apply already done (see scripts/update-ip.sh),
# hosts already updated (see scripts/update-hosts.sh),
# terraform/keys/my-ssh-key set to 600.
#
# NB: install-terraform.yml is NOT included here because it runs
# on localhost, upstream, to equip the control machine
# (see README.md). It is run separately if needed:
#   ansible-playbook playbooks/install-terraform.yml
# ============================================================

- name: "Step 1 - HA K3s cluster (3 masters + 3 workers)"
  import_playbook: playbooks/install-k3s.yml
  tags: k3s

- name: "Step 2 - cert-manager + Let's Encrypt (TLS)"
  import_playbook: playbooks/install-cert-manager.yml
  tags: cert-manager

- name: "Step 3 - ArgoCD (GitOps)"
  import_playbook: playbooks/install-argocd.yml
  tags: argocd

- name: "Step 4 - Monitoring (Prometheus + Grafana)"
  import_playbook: playbooks/install-monitoring.yml
  tags: monitoring

- name: "Step 5 - Demo application (guestbook via ArgoCD)"
  import_playbook: playbooks/guestbook.yml
  tags: guestbook

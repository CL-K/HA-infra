[defaults]
# Project inventory (file "hosts", not "inventory.ini")
inventory = ./hosts

# Disable SSH host key checking (needed here: EC2 instances
# generate new host keys on every apply, and the ProxyJump to the
# workers would make manual confirmation painful)
host_key_checking = False

# Readable output (new syntax, replaces the old community.general.yaml callback)
stdout_callback = default
result_format = yaml

# Parallelism (10 is generous for 6 nodes, but causes no problem)
forks = 10

# Default SSH user (avoids repeating it in the inventory)
remote_user = ubuntu

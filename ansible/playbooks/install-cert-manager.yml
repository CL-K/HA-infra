---
# ============================================================
# install-cert-manager.yml
#
# Installs cert-manager (Helm) and creates two Let's Encrypt
# ClusterIssuers (staging + prod) using the HTTP-01 challenge via
# the "traefik" IngressClass already present in k3s.
#
# IMPORTANT prerequisites:
#   - The DNS of argocd.domain.com and monitoring.domain.com must
#     ALREADY point to the public IP of master1 (EIP) before
#     running this playbook: the HTTP-01 challenge is validated by
#     Let's Encrypt over HTTP (port 80) from the outside.
#   - Port 80 must remain open in the security group
#     (it already is, see terraform/main.tf).
#
# Variable to set: letsencrypt_email (Let's Encrypt contact
# email, used for expiration alerts). Pass it via
# --extra-vars or edit it below.
#
# Usage:
#   ansible-playbook site.yml --tags cert-manager \
#     -e letsencrypt_email=YOUR_REAL_EMAIL@YOUR_DOMAIN.com
# ============================================================

- name: Install cert-manager and configure Let's Encrypt
  hosts: "{{ groups['master'][0] }}"
  become: yes
  vars:
    kube_user: "ubuntu"
    kubeconfig_path: "/home/ubuntu/.kube/config"
    helm_version: "v3.15.4"
    cert_manager_version: "v1.15.3"
    # To customize (mandatory for Let's Encrypt):
    letsencrypt_email: "changeme@domain.com"

  tasks:
    # --- Safeguard: refuses to continue with a placeholder email or
    #     a reserved domain (example.com/org/net), explicitly rejected
    #     by Let's Encrypt (ACME invalidContact error otherwise) ---
    - name: Check that letsencrypt_email is a real address (not a placeholder)
      assert:
        that:
          - letsencrypt_email != "changeme@domain.com"
          - letsencrypt_email is not search("@example\\.(com|org|net)$")
        fail_msg: >-
          letsencrypt_email="{{ letsencrypt_email }}" is a placeholder
          or a reserved domain (example.com/org/net), rejected by Let's
          Encrypt (ACME invalidContact error). Rerun with a real
          address: -e letsencrypt_email=your.email@yourdomain.com
        success_msg: "letsencrypt_email looks valid."

    # --- Install Helm (idempotent, pinned version) ---
    - name: Download the Helm installation script
      get_url:
        url: "https://raw.githubusercontent.com/helm/helm/{{ helm_version }}/scripts/get-helm-3"
        dest: /tmp/get_helm.sh
        mode: '0755'

    - name: Install Helm
      command: /tmp/get_helm.sh
      args:
        creates: /usr/local/bin/helm
      environment:
        DESIRED_VERSION: "{{ helm_version }}"

    # --- Add the Jetstack repo (idempotent) ---
    - name: Add the Jetstack Helm repo (cert-manager)
      command: helm repo add jetstack https://charts.jetstack.io
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Update the Helm repos
      command: helm repo update
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Install/upgrade cert-manager (with its CRDs) ---
    - name: Deploy/upgrade cert-manager via Helm
      command: >
        helm upgrade --install cert-manager jetstack/cert-manager
        --namespace cert-manager --create-namespace
        --version {{ cert_manager_version }}
        --set crds.enabled=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for the cert-manager pods to be ready
      command: kubectl get pods -n cert-manager
      register: cm_pods
      retries: 20
      delay: 15
      until: "'ContainerCreating' not in cm_pods.stdout and 'Pending' not in cm_pods.stdout"
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for the cert-manager webhook to be available
      command: kubectl wait --for=condition=Available --timeout=120s deployment/cert-manager-webhook -n cert-manager
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Let's Encrypt STAGING ClusterIssuer (to test without
    #     exhausting the prod rate limit during the first attempts) ---
    - name: Deploy the letsencrypt-staging ClusterIssuer
      copy:
        dest: /tmp/clusterissuer-staging.yaml
        content: |
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-staging
          spec:
            acme:
              server: https://acme-staging-v02.api.letsencrypt.org/directory
              email: {{ letsencrypt_email }}
              privateKeySecretRef:
                name: letsencrypt-staging-account-key
              solvers:
                - http01:
                    ingress:
                      ingressClassName: traefik

    - name: Apply the letsencrypt-staging ClusterIssuer
      command: kubectl apply -f /tmp/clusterissuer-staging.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Let's Encrypt PROD ClusterIssuer (used by the ArgoCD and
    #     Grafana Ingresses via the cert-manager.io/cluster-issuer annotation) ---
    - name: Deploy the letsencrypt-prod ClusterIssuer
      copy:
        dest: /tmp/clusterissuer-prod.yaml
        content: |
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: {{ letsencrypt_email }}
              privateKeySecretRef:
                name: letsencrypt-prod-account-key
              solvers:
                - http01:
                    ingress:
                      ingressClassName: traefik

    - name: Apply the letsencrypt-prod ClusterIssuer
      command: kubectl apply -f /tmp/clusterissuer-prod.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Check that the ClusterIssuers are ready (Ready=True)
      command: kubectl get clusterissuer -o wide
      register: issuers
      retries: 10
      delay: 10
      until: "'True' in issuers.stdout"
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - debug:
        msg: "{{ issuers.stdout_lines }}"

    - name: cert-manager summary
      debug:
        msg: |
          cert-manager installed, ClusterIssuers "letsencrypt-staging" and
          "letsencrypt-prod" ready.

          The ArgoCD and Grafana Ingresses (next steps) automatically
          use letsencrypt-prod via the
          cert-manager.io/cluster-issuer annotation.

          Reminder: the DNS of argocd.domain.com and monitoring.domain.com
          must already point to the public IP of master1
          ({{ ansible_host }}) for the HTTP-01 challenge to succeed.

- hosts: "{{ groups['master'][0] }}"
  become: yes
  vars:
    kube_user: "ubuntu"
    kubeconfig_path: "/home/ubuntu/.kube/config"
    helm_version: "v3.15.4"
    # grafana_admin_password is NO LONGER defined here in plaintext: it comes
    # from ansible/group_vars/master/vault.yml, encrypted via ansible-vault
    # (see ansible/group_vars/master/vault.yml.example and the README,
    # Security section). Ansible loads group_vars/master/*.yml
    # automatically because this play targets a host of the [master] group.

  tasks:
    # --- Safeguard: refuses to continue without a Grafana password
    #     defined via the vault (avoids a silent fallback to a plaintext
    #     default, or an unclear Helm failure further down) ---
    - name: Check that grafana_admin_password is defined (via vault)
      assert:
        that:
          - grafana_admin_password is defined
          - grafana_admin_password | length > 0
          - grafana_admin_password != "CHANGE_ME_before_ansible-vault_encrypt"
        fail_msg: >-
          grafana_admin_password is not defined (or kept its placeholder
          value). Create ansible/group_vars/master/vault.yml from
          vault.yml.example, customize the password, encrypt it
          with `ansible-vault encrypt ansible/group_vars/master/vault.yml`,
          then rerun this playbook with --ask-vault-pass (see README,
          Security section).
        success_msg: "grafana_admin_password is properly defined."
      no_log: true

    # --- Install Helm (idempotent, pinned version) ---
    - name: Download the Helm installation script
      get_url:
        url: "https://raw.githubusercontent.com/helm/helm/{{ helm_version }}/scripts/get-helm-3"
        dest: /tmp/get_helm.sh
        mode: '0755'

    - name: Install Helm
      command: /tmp/get_helm.sh
      args:
        creates: /usr/local/bin/helm
      environment:
        DESIRED_VERSION: "{{ helm_version }}"

    # --- Add the prometheus-community repo (idempotent) ---
    - name: Add the prometheus-community Helm repo
      command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Update the Helm repos
      command: helm repo update
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Install/upgrade kube-prometheus-stack ---
    # Grafana stays on ClusterIP (no NodePort): external access
    # goes through the Traefik Ingress (already installed by k3s, ports 80/443
    # already open in the security group).
    - name: Deploy/upgrade kube-prometheus-stack (Prometheus + Grafana)
      command: >
        helm upgrade --install monitoring prometheus-community/kube-prometheus-stack
        --namespace monitoring --create-namespace
        --set grafana.service.type=ClusterIP
        --set grafana.adminPassword={{ grafana_admin_password }}
        --set grafana.persistence.enabled=true
        --set grafana.persistence.size=10Gi
        --set prometheus.persistence.enabled=true
        --set prometheus.persistence.size=20Gi
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      no_log: true # protects the password from the Ansible logs

    # --- HTTPS Traefik Ingress: exposes Grafana on port 443 of the
    #     cluster, Let's Encrypt certificate managed automatically by
    #     cert-manager (ClusterIssuer letsencrypt-prod, see
    #     playbooks/install-cert-manager.yml, must run BEFORE this
    #     playbook). TLS is terminated by Traefik; the
    #     Ingress -> Grafana service traffic stays plain HTTP inside the cluster.
    - name: Deploy the Ingress manifest for Grafana
      copy:
        dest: /tmp/grafana-ingress.yaml
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: grafana-ingress
            namespace: monitoring
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              cert-manager.io/cluster-issuer: letsencrypt-prod
          spec:
            ingressClassName: traefik
            tls:
              - hosts:
                  - monitoring.domain.com
                secretName: grafana-tls
            rules:
              - host: monitoring.domain.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: monitoring-grafana
                          port:
                            number: 80

    - name: Apply the Grafana Ingress
      command: kubectl apply -f /tmp/grafana-ingress.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Checks ---
    - name: Wait for the monitoring pods to be ready
      command: kubectl get pods -n monitoring
      register: result
      retries: 20
      delay: 15
      until: "'ContainerCreating' not in result.stdout and 'Pending' not in result.stdout"
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - debug:
        msg: "{{ result.stdout }}"

    - name: Check the Grafana service
      command: kubectl get svc -n monitoring monitoring-grafana
      register: grafana_svc
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - debug:
        msg: "{{ grafana_svc.stdout }}"

    # --- Check that the Let's Encrypt certificate was issued ---
    - name: Wait for the Grafana TLS certificate to be Ready
      command: kubectl get certificate -n monitoring grafana-tls -o jsonpath="{.status.conditions[?(@.type=='Ready')].status}"
      register: cert_status
      retries: 15
      delay: 15
      until: cert_status.stdout == "True"
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Warning if the certificate is not ready
      debug:
        msg: >-
          WARNING: the Grafana TLS certificate is not Ready yet.
          Check that the DNS of monitoring.domain.com points to
          {{ ansible_host }} and inspect: kubectl describe certificate
          -n monitoring grafana-tls
      when: cert_status.stdout != "True"

    - name: Display the Grafana access URL
      debug:
        msg: "Grafana accessible at: https://monitoring.domain.com/  (Let's Encrypt TLS, user: admin)"

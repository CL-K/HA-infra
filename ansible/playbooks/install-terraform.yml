---
# ============================================================
# Playbook: install Terraform on this Ubuntu machine
# Runs on localhost (the VM itself, not a remote node)
# ============================================================
- name: Install Terraform (HashiCorp) on Ubuntu
  hosts: localhost
  connection: local
  become: yes
  vars:
    terraform_version: ""   # leave empty = latest version available via apt

  tasks:
    - name: Install base dependencies
      apt:
        name:
          - gnupg
          - software-properties-common
          - curl
          - ca-certificates
          - lsb-release
        state: present
        update_cache: yes

    - name: Create the directory for GPG keys (modern method, apt-key is deprecated)
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download and install the official HashiCorp GPG key
      shell: |
        curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /etc/apt/keyrings/hashicorp.gpg
      args:
        creates: /etc/apt/keyrings/hashicorp.gpg

    - name: "Get the Ubuntu distribution codename (e.g. jammy, noble)"
      command: lsb_release -cs
      register: ubuntu_codename
      changed_when: false

    - name: Add the official HashiCorp repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com {{ ubuntu_codename.stdout }} main"
        state: present
        filename: hashicorp

    - name: Update the apt cache after adding the repository
      apt:
        update_cache: yes

    - name: Install Terraform
      apt:
        name: "terraform{{ '=' + terraform_version if terraform_version | length > 0 else '' }}"
        state: present

    - name: Check the installation (display the version)
      command: terraform -version
      register: tf_version
      changed_when: false

    - name: Display the installed version
      debug:
        var: tf_version.stdout_lines

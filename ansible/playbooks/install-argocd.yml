---
- name: Install ArgoCD on the k3s master
  hosts: "{{ groups['master'][0] }}"
  become: yes
  vars:
    kube_user: "ubuntu"
    kubeconfig_path: "/home/ubuntu/.kube/config"
    helm_version: "v3.15.4"
    argocd_hostname: "argocd.domain.com"

  tasks:
    # --- Install Helm (idempotent, pinned version) ---
    - name: Download the Helm installation script
      get_url:
        url: "https://raw.githubusercontent.com/helm/helm/{{ helm_version }}/scripts/get-helm-3"
        dest: /tmp/get_helm.sh
        mode: '0755'

    - name: Install Helm
      command: /tmp/get_helm.sh
      args:
        creates: /usr/local/bin/helm
      environment:
        DESIRED_VERSION: "{{ helm_version }}"

    # --- Add the ArgoCD repo (idempotent) ---
    - name: Add the ArgoCD Helm repo
      command: helm repo add argo https://argoproj.github.io/argo-helm
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout"
      failed_when: repo_add.rc != 0 and 'already exists' not in repo_add.stderr
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Update the Helm repos
      command: helm repo update
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Install/upgrade ArgoCD ---
    # server.service.type stays ClusterIP (no NodePort): external
    # access goes through a classic Traefik Ingress,
    # like for Grafana.
    #
    # SECURITY WARNING: server.insecure=true makes ArgoCD serve plain
    # HTTP (no internal TLS). Login credentials then
    # travel in clear text on the network. Acceptable in dev/internal use,
    # not recommended if the cluster is publicly exposed to the Internet.
    # For HTTPS on port 443, switch back to server.insecure=false and
    # use the IngressRouteTCP in TLS passthrough (previous version).
    - name: Deploy/upgrade ArgoCD via Helm
      command: >
        helm upgrade --install argocd argo/argo-cd
        --namespace argocd --create-namespace
        --set server.service.type=ClusterIP
        --set configs.params."server\.insecure"=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- HTTPS Traefik Ingress (port 443) to argocd.domain.com,
    #     Let's Encrypt certificate managed automatically by
    #     cert-manager (ClusterIssuer letsencrypt-prod, see
    #     playbooks/install-cert-manager.yml, must run BEFORE
    #     this playbook). TLS is terminated by Traefik; the
    #     Ingress -> argocd-server service traffic stays plain HTTP inside
    #     the cluster (server.insecure=true above therefore remains
    #     appropriate, see the security note above).
    - name: Deploy the Ingress manifest for ArgoCD
      copy:
        dest: /tmp/argocd-ingress.yaml
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: argocd-server-ingress
            namespace: argocd
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              cert-manager.io/cluster-issuer: letsencrypt-prod
          spec:
            ingressClassName: traefik
            tls:
              - hosts:
                  - {{ argocd_hostname }}
                secretName: argocd-server-tls
            rules:
              - host: {{ argocd_hostname }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: argocd-server
                          port:
                            number: 80

    - name: Apply the ArgoCD Ingress
      command: kubectl apply -f /tmp/argocd-ingress.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Checks ---
    - name: Wait for the ArgoCD pods to be ready
      command: kubectl get pods -n argocd
      register: result
      retries: 20
      delay: 15
      until: "'ContainerCreating' not in result.stdout and 'Pending' not in result.stdout"
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - debug:
        msg: "{{ result.stdout }}"

    - name: Check the ArgoCD service
      command: kubectl get svc -n argocd argocd-server
      register: argocd_svc
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - debug:
        msg: "{{ argocd_svc.stdout }}"

    # --- Check that the Let's Encrypt certificate was issued ---
    - name: Wait for the ArgoCD TLS certificate to be Ready
      command: kubectl get certificate -n argocd argocd-server-tls -o jsonpath="{.status.conditions[?(@.type=='Ready')].status}"
      register: cert_status
      retries: 15
      delay: 15
      until: cert_status.stdout == "True"
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Warning if the certificate is not ready
      debug:
        msg: >-
          WARNING: the ArgoCD TLS certificate is not Ready yet.
          Check that the DNS of {{ argocd_hostname }} points to
          {{ ansible_host }} and inspect: kubectl describe certificate
          -n argocd argocd-server-tls
      when: cert_status.stdout != "True"

    - name: Retrieve the initial admin password
      command: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}"
      register: argocd_password_b64
      changed_when: false
      no_log: true # protects the password from the Ansible logs
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Final summary ---
    - name: Display ArgoCD access information
      debug:
        msg: |
          ArgoCD is installed and accessible:
          - URL: https://{{ argocd_hostname }}/  (Let's Encrypt TLS via cert-manager)
          - User: admin
          - Password: see the output of the previous task (base64),
            decode with: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
          - Make sure the DNS of {{ argocd_hostname }} points to {{ ansible_host }}

---
# ============================================================
# HA K3s playbook - 3 masters (embedded etcd) + 3 workers, spread
# over 3 AZs (see terraform/main.tf, var az_count). Fixed private
# IPs defined in ansible/hosts (192.168.2.10/74/138 for the
# masters, 192.168.3.10/74/138 for the workers - one IP per AZ,
# see the comments in the hosts file for the calculation details).
# Masters with EIP (public access), workers on private IP only
# (SSH via ProxyJump defined in hosts, works whatever the
# AZ of the target worker thanks to native routing between subnets of the
# same VPC).
#
# Rule: INTERNAL cluster traffic (etcd join, K3S_URL) always
# uses the PRIVATE IPs (node_private_ip), never the public IPs
# of the masters.
#
# FIXES applied:
#   - Play 2: serial: 1 to join the etcd masters one by one
#     (avoids race conditions on the etcd quorum)
#   - Play 2/3: wait_for on port 6443 / 10250 instead of
#     relying on the immediate status of the systemd module
#   - Play 2: kubectl get nodes (Ready) check after each
#     master join, before moving on to the next one
# ============================================================

# ------------------------------------------------------------
# Play 1: First master - initializes the cluster (cluster-init)
# ------------------------------------------------------------
- name: Install the first K3s master (cluster-init)
  hosts: "{{ groups['master'][0] }}"
  become: yes
  vars:
    k3s_version: "v1.30.4+k3s1"
    kube_user: "ubuntu"
    kube_group: "kube"

  tasks:
    - name: Install dependencies
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: Create the kube group if absent
      group:
        name: "{{ kube_group }}"
        state: present

    - name: Add user {{ kube_user }} to the kube group
      user:
        name: "{{ kube_user }}"
        groups: "{{ kube_group }}"
        append: yes

    - name: Install k3s (first master, cluster-init)
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} \
        sh -s - server --cluster-init \
        {% for h in groups['master'] %}--tls-san {{ hostvars[h].node_private_ip }} --tls-san {{ hostvars[h].ansible_host }} {% endfor %} \
        --node-ip {{ node_private_ip }} \
        --node-name {{ inventory_hostname }} \
        --write-kubeconfig-group {{ kube_group }}
      args:
        creates: /etc/rancher/k3s/k3s.yaml
      no_log: true

    - name: Wait for k3s to be ready (node-token file generated)
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 90

    - name: Wait for the API port 6443 to be available
      wait_for:
        port: 6443
        host: "{{ node_private_ip }}"
        timeout: 120

    - name: Retrieve the k3s token
      command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token
      changed_when: false
      no_log: true

    - name: Expose the token and the join URL for the following plays
      set_fact:
        k3s_join_token: "{{ k3s_token.stdout }}"
        k3s_join_url: "https://{{ node_private_ip }}:6443"
      no_log: true

    - name: Create the .kube directory for {{ kube_user }}
      file:
        path: /home/{{ kube_user }}/.kube
        state: directory
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: '0755'

    - name: Copy the k3s configuration for {{ kube_user }}
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/{{ kube_user }}/.kube/config
        remote_src: yes
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: '0640'

    # --- IMPORTANT: /home/{{ kube_user }}/.kube/config KEEPS
    #     127.0.0.1 as the server address. This file is used
    #     by ALL kubectl/helm commands run FROM master1 in the
    #     following playbooks (cert-manager, argocd, monitoring...).
    #     Replacing it with the public IP would break those calls: AWS
    #     does not support hairpin NAT (an instance cannot reach
    #     itself through its own public IP/EIP - the
    #     packet leaves via the IGW but cannot come back). Hence a
    #     SEPARATE kubeconfig, only for EXTERNAL use (from
    #     your machine, which does not have this hairpin problem).
    - name: Create an EXTERNAL kubeconfig (public IP) for access from your machine
      copy:
        src: /home/{{ kube_user }}/.kube/config
        dest: /home/{{ kube_user }}/.kube/config-external
        remote_src: yes
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: '0640'

    - name: Replace the localhost address with the public IP (external kubeconfig only)
      replace:
        path: /home/{{ kube_user }}/.kube/config-external
        regexp: '127\.0\.0\.1'
        replace: '{{ ansible_host }}'

    - name: Add KUBECONFIG (internal, 127.0.0.1) to the .bashrc of {{ kube_user }}
      lineinfile:
        path: "/home/{{ kube_user }}/.bashrc"
        line: 'export KUBECONFIG=/home/{{ kube_user }}/.kube/config'
        state: present

    - name: Check that the cluster is ready
      command: kubectl get nodes
      register: result
      retries: 10
      delay: 15
      until: result.rc == 0
      changed_when: false
      environment:
        KUBECONFIG: /home/{{ kube_user }}/.kube/config

    - name: Display how to retrieve the external kubeconfig
      debug:
        msg: |
          K3s cluster ready. To control the cluster FROM YOUR MACHINE
          (and not from master1), retrieve the external kubeconfig:

            scp -i terraform/keys/my-ssh-key \
              ubuntu@{{ ansible_host }}:/home/{{ kube_user }}/.kube/config-external \
              ./kubeconfig-{{ inventory_hostname }}

          Then: export KUBECONFIG=./kubeconfig-{{ inventory_hostname }}
                 kubectl get nodes

          (The file /home/{{ kube_user }}/.kube/config on master1,
          on the other hand, keeps 127.0.0.1: it is the one used by the
          following playbooks which run kubectl/helm from master1 itself -
          AWS does not allow an instance to reach itself through its own
          public IP.)

# ------------------------------------------------------------
# Play 2: Additional masters - join the existing cluster
# serial: 1 => one master at a time so as not to weaken the
# etcd quorum during concurrent joins.
# ------------------------------------------------------------
- name: Install the additional masters (HA join)
  hosts: "master:!{{ groups['master'][0] }}"
  become: yes
  serial: 1
  vars:
    k3s_version: "v1.30.4+k3s1"
    kube_user: "ubuntu"
    kube_group: "kube"
    first_master: "{{ groups['master'][0] }}"

  tasks:
    - name: Install dependencies
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: Create the kube group if absent
      group:
        name: "{{ kube_group }}"
        state: present

    - name: Install k3s (additional master, joins the cluster via private IP)
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} \
        sh -s - server \
        --server {{ hostvars[first_master].k3s_join_url }} \
        --token {{ hostvars[first_master].k3s_join_token }} \
        {% for h in groups['master'] %}--tls-san {{ hostvars[h].node_private_ip }} --tls-san {{ hostvars[h].ansible_host }} {% endfor %} \
        --node-ip {{ node_private_ip }} \
        --node-name {{ inventory_hostname }} \
        --write-kubeconfig-group {{ kube_group }}
      args:
        creates: /etc/rancher/k3s/k3s.yaml
      no_log: true

    - name: Check that the k3s service is started
      systemd:
        name: k3s
        state: started

    - name: Wait for the local API port 6443 to be available
      wait_for:
        port: 6443
        host: "{{ node_private_ip }}"
        timeout: 180

    - name: Wait for this master to join etcd and appear Ready
      command: kubectl get node {{ inventory_hostname }} --no-headers
      register: node_status
      retries: 15
      delay: 10
      until: node_status.rc == 0 and 'Ready' in node_status.stdout
      changed_when: false
      environment:
        KUBECONFIG: /home/{{ kube_user }}/.kube/config
      delegate_to: "{{ first_master }}"

# ------------------------------------------------------------
# Play 3: Workers - join the cluster as agents
# (SSH via ProxyJump defined in the hosts inventory, targeting master1)
# ------------------------------------------------------------
- name: Install the K3s workers (agents)
  hosts: worker
  become: yes
  vars:
    k3s_version: "v1.30.4+k3s1"
    first_master: "{{ groups['master'][0] }}"

  tasks:
    - name: Install dependencies
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: Install k3s agent (worker, joins via private IP)
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} \
        K3S_URL={{ hostvars[first_master].k3s_join_url }} \
        K3S_TOKEN={{ hostvars[first_master].k3s_join_token }} \
        K3S_NODE_IP={{ node_private_ip }} \
        K3S_NODE_NAME={{ inventory_hostname }} \
        sh -
      args:
        creates: /etc/systemd/system/k3s-agent.service
      no_log: true

    - name: Check that the k3s-agent service is started
      systemd:
        name: k3s-agent
        state: started

    - name: Wait for the worker's kubelet to respond (port 10250)
      wait_for:
        port: 10250
        host: "{{ node_private_ip }}"
        timeout: 120

# ------------------------------------------------------------
# Play 4: Final check from the first master
# ------------------------------------------------------------
- name: Check the final state of the cluster
  hosts: "{{ groups['master'][0] }}"
  become: yes
  vars:
    kube_user: "ubuntu"

  tasks:
    - name: Wait for all nodes to be registered and Ready
      command: kubectl get nodes --no-headers
      register: all_nodes
      retries: 15
      delay: 10
      until: >
        all_nodes.rc == 0 and
        (all_nodes.stdout_lines | select('search', 'Ready') | list | length) ==
        (groups['master'] | length + groups['worker'] | length)
      changed_when: false
      environment:
        KUBECONFIG: /home/{{ kube_user }}/.kube/config

    - name: List all the cluster nodes (3 masters + 3 workers expected)
      command: kubectl get nodes -o wide
      register: final_nodes
      changed_when: false
      environment:
        KUBECONFIG: /home/{{ kube_user }}/.kube/config

    - name: Display the result
      debug:
        var: final_nodes.stdout_lines
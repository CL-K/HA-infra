---
- name: Test ArgoCD with the demo namespace and the guestbook application
  hosts: "{{ groups['master'][0] }}"
  become: yes
  vars:
    kubeconfig_path: "/home/ubuntu/.kube/config"
    argocd_hostname: "argocd.domain.com"

  tasks:
    # --- Create the demo namespace ---
    - name: Create the demo namespace
      shell: kubectl create namespace demo --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Create the ArgoCD guestbook application ---
    - name: Create the ArgoCD guestbook application
      shell: |
        cat <<EOF | kubectl apply -n argocd -f -
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: guestbook
          namespace: argocd
        spec:
          project: default
          source:
            repoURL: https://github.com/argoproj/argocd-example-apps
            targetRevision: HEAD
            path: guestbook
          destination:
            server: https://kubernetes.default.svc
            namespace: demo
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
        EOF
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Wait for the real synchronization (syncPolicy.automated takes
    # care of it automatically, no need to force anything) ---
    - name: Wait for the guestbook application to be Synced and Healthy
      command: >
        kubectl -n argocd get application guestbook
        -o jsonpath='{.status.sync.status}/{.status.health.status}'
      register: app_status
      retries: 20
      delay: 15
      until: app_status.stdout == "Synced/Healthy"
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # --- Final check of the pods deployed in demo ---
    - name: Check the pods in the demo namespace
      command: kubectl get pods -n demo
      register: demo_pods
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - debug:
        msg: "{{ demo_pods.stdout }}"

    # --- Final summary ---
    - name: Display the test information
      debug:
        msg: |
          Namespace demo created
          ArgoCD application "guestbook" registered and synchronized ({{ app_status.stdout }})
          Source: official repository https://github.com/argoproj/argocd-example-apps (path: guestbook)

          You can see the application in the ArgoCD interface:
          - URL: https://{{ argocd_hostname }}/
          - User: admin
          - Password:
            kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d && echo

          The "guestbook" application is deployed automatically in the demo namespace.
